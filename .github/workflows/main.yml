name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Daha kararlı bir Ubuntu sürümüne sabitledik

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf automake libtool pkg-config cmake
        pip install --upgrade pip
        pip install buildozer cython virtualenv openpyxl

    - name: Build with Buildozer
      run: |
        # Sunucunun kendi yüklü gelen çakışma yaratan SDK yollarını temizliyoruz
        export ANDROID_HOME=""
        export ANDROID_NDK_HOME=""
        
        # Buildozer'a her şeyi sıfırdan kendi izole klasörüne kurmasını söylüyoruz
        buildozer -v android debug --auto-accept-sdk-license
