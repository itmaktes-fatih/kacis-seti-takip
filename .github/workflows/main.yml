name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # Daha kararlı bir Ubuntu sürümüne sabitledik

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt update
        # Sadece Android ve Kivy için hayati olan paketleri, sistemi zorlamayacak şekilde kuruyoruz
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools python3-dev autoconf automake libtool pkg-config cmake zlib1g-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv openpyxl

    - name: Build with Buildozer
      run: |
        # Sunucunun kendi yüklü gelen çakışma yaratan SDK yollarını temizliyoruz
        export ANDROID_HOME=""
        export ANDROID_NDK_HOME=""
        
        # Buildozer'a her şeyi sıfırdan kendi izole klasörüne kurmasını söylüyoruz
        buildozer -v android debug --auto-accept-sdk-license
