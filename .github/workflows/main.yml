name: Build APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-22.04

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Install dependencies
    run: |
      sudo apt-get update
      sudo apt-get install -y \
        git zip unzip autoconf automake libtool \
        pkg-config zlib1g-dev libncurses5-dev \
        libncursesw5-dev cmake libffi-dev libssl-dev

      python -m pip install --upgrade pip
      pip install buildozer cython==0.29.36

  - name: Accept Android licenses
    run: |
      mkdir -p ~/.android
      echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > ~/.android/repositories.cfg || true

  - name: Build APK
    env:
      ANDROID_ACCEPT_LICENSE: "True"
    run: |
      buildozer android debug

  - uses: actions/upload-artifact@v4
    with:
      name: apk
      path: bin/*.apk
```
