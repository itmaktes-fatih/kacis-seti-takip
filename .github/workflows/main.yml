name: Build APK

on:
  workflow_dispatch: # APK derlemesini biz manuel olarak tetikleyeceğiz

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good autoconf automake libtool pkg-config cmake
        pip install --upgrade pip
        pip install buildozer cython virtualenv openpyxl

    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Kaçış Seti Takip APK
        path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/dists/kacissetitakip/build/outputs/apk/debug/*.apk
